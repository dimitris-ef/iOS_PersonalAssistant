# XcodeGen spec for the iOS app target.
#
# The repository has no `.xcodeproj`, because a hand-written `project.pbxproj`
# is unreviewable and goes stale the moment anyone touches it in Xcode. This
# spec generates one instead:
#
#     brew install xcodegen
#     xcodegen generate
#     open PersonalAssistant.xcodeproj
#
# Creating the target by hand in Xcode works equally well — this file then
# doubles as the checklist of what that target needs. See iOS/README.md.
#
# Run through XcodeGen on every CI build — both the simulator preview and the
# Apple SDK check generate the project from this file and compile it. What
# remains unverified is opening the result in Xcode by hand.

name: PersonalAssistant

options:
  bundleIdPrefix: com.example.personalassistant
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

packages:
  PhonePersonalAI:
    # The core lives in the Swift package at the repository root.
    path: .

targets:
  PersonalAssistant:
    type: application
    platform: iOS
    # Development configuration. Config/App.xcconfig optionally includes the
    # gitignored Config/LocalSecrets.xcconfig; absent, everything stays blank.
    configFiles:
      Debug: Config/App.xcconfig
      Release: Config/App.xcconfig
    sources:
      - path: iOS/App
      - path: iOS/Data
      - path: iOS/Presentation
      - path: iOS/RemoteAI
      - path: iOS/ViewModels
      - path: iOS/UI
      # Siri, Shortcuts and the Action Button. Every file here is a thin
      # shell over `AssistantCommandService`; no assistant logic lives in the
      # App Intents layer.
      - path: iOS/Intents
      - path: iOS/Resources
      # What is left of the app-target platform code: the Keychain store. The
      # calendar, reminder, notification and alarm adapters moved into the
      # `AssistantPlatformApple` package target, because `iOS/` has no test
      # target and the mapping decisions in them are worth testing.
      - path: iOS/Platform
      # The speech-to-text composition root: which providers exist, which
      # runtime backs the local one, and where the OpenAI credential is read.
      - path: iOS/Voice
      # Shared with the extensions: the ActivityKit attributes, the widget
      # intents, the App Group store location and the narrow composition an
      # extension is allowed to build. Compiled into the app *and* into the
      # widget extension, because an interactive widget's App Intent has to
      # exist in both — iOS runs it in the extension, and the app has to be
      # able to hand the extension its own composition when it is already open.
      - path: iOS/SystemSurfaces/Shared
    dependencies:
      - package: PhonePersonalAI
        product: AssistantCore
      - package: PhonePersonalAI
        product: AssistantDomain
      - package: PhonePersonalAI
        product: AssistantAI
      - package: PhonePersonalAI
        product: AssistantTools
      - package: PhonePersonalAI
        product: AssistantPlatform
      - package: PhonePersonalAI
        product: AssistantPersistence
      # The production store. SwiftData lives in this target and nowhere else.
      - package: PhonePersonalAI
        product: AssistantPersistenceSwiftData
      - package: PhonePersonalAI
        product: ExecutiveSupport
      # Memory relevance: ranking, deduplication, prompt formatting.
      - package: PhonePersonalAI
        product: PersonalMemory
      # Apple's on-device sentence embeddings. The only place NaturalLanguage is
      # linked; removing this product drops the app to the lexicon encoder with
      # no other change, which is the fallback the memory layer already handles.
      - package: PhonePersonalAI
        product: PersonalMemoryApple
      - package: PhonePersonalAI
        product: MockPlatform
      # The real iPhone: EventKit, UserNotifications, AlarmKit. Adding this
      # product is what makes the app's actions actually happen; removing it
      # again would put the app back on mocks with no other change.
      - package: PhonePersonalAI
        product: AssistantPlatformApple
      # Speech in, speech out: SFSpeechRecognizer, AVAudioEngine and
      # AVSpeechSynthesizer, behind a protocol the UI depends on instead.
      - package: PhonePersonalAI
        product: AssistantVoice
      # Speech-to-text. Separate products so the dependency graph shows what
      # each provider can reach: SpeechToTextLocal has no networking,
      # SpeechToTextOpenAI has no assistant provider.
      - package: PhonePersonalAI
        product: SpeechToText
      - package: PhonePersonalAI
        product: SpeechToTextApple
      - package: PhonePersonalAI
        product: SpeechToTextLocal
      - package: PhonePersonalAI
        product: SpeechToTextOpenAI
      # The whisper.cpp adapter. Linking the actual binary is opt-in: generate
      # with PPAI_WHISPER_RUNTIME=1 for a device build that can transcribe
      # on-device. Without it this product still builds and links, reporting
      # the runtime unavailable.
      - package: PhonePersonalAI
        product: SpeechToTextLocalWhisper
      - package: PhonePersonalAI
        product: AIProviderApple
      - package: PhonePersonalAI
        product: AIProviderLocal
      # Download, checksum and storage for large native model files, shared by
      # the local LLM and local speech stacks.
      - package: PhonePersonalAI
        product: NativeModelKit
      # The llama.cpp adapter. Linking the actual llama.cpp binary is opt-in:
      # generate the project with PPAI_LLAMA_RUNTIME=1 for a device build that
      # can run downloaded models. Without it this product still builds and
      # links — it just reports the runtime unavailable, which is what keeps
      # the simulator lane working, since the published llama.cpp XCFramework
      # has no simulator slice. See the note at the top of Package.swift.
      - package: PhonePersonalAI
        product: AIProviderLocalLlama
      - package: PhonePersonalAI
        product: AIProviderRemote
      # Development-only: the scripted stand-in that drives the assistant while
      # no model is connected. Remove this dependency when one is.
      - package: PhonePersonalAI
        product: DevSupport
      # What the extensions are allowed to see: versioned snapshots, the App
      # Group store, the keyboard exchange.
      - package: PhonePersonalAI
        product: SystemSurfaces
      # The extensions are embedded in the app bundle. Without these two lines
      # they would build and then not exist on the device.
      - target: PersonalAssistantWidgets
      - target: PersonalAssistantKeyboard
    settings:
      base:
        INFOPLIST_FILE: iOS/Resources/Info.plist
        PRODUCT_BUNDLE_IDENTIFIER: com.example.personalassistant
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: "1" # iPhone
        SWIFT_VERSION: "5.0"
        ENABLE_USER_SCRIPT_SANDBOXING: YES
        # The Info.plist is written by hand, so nothing is generated into it.
        # Every key the system needs is in iOS/Resources/Info.plist.
        GENERATE_INFOPLIST_FILE: NO
        DEVELOPMENT_LANGUAGE: en
        MARKETING_VERSION: "0.1"
        CURRENT_PROJECT_VERSION: "1"
        # Simulator builds in CI must not need a signing identity.
        CODE_SIGNING_ALLOWED: NO
        CODE_SIGNING_REQUIRED: NO
        CODE_SIGN_IDENTITY: ""
        CODE_SIGN_ENTITLEMENTS: iOS/Resources/PersonalAssistant.entitlements

  # MARK: Widgets, Lock Screen and Live Activities
  #
  # One extension for all of it (section 82). Its dependency list is the
  # architectural claim of the milestone: repositories, the support lifecycle
  # and the projections — and **no AI**. `AIProviderRemote`, `AIProviderApple`,
  # `AIProviderLocal` and `AIProviderLocalLlama` are all absent, deliberately,
  # so a widget cannot invoke a model even by accident and the extension binary
  # does not carry an inference runtime it would never have the memory to use.
  PersonalAssistantWidgets:
    type: app-extension
    platform: iOS
    sources:
      - path: iOS/SystemSurfaces/Widgets
      # Shared with the app. The App Intents behind Done, Later and I'm doing
      # it must be in this target: iOS performs an interactive widget's intent
      # in the widget extension's process.
      - path: iOS/SystemSurfaces/Shared
    dependencies:
      - package: PhonePersonalAI
        product: SystemSurfaces
      - package: PhonePersonalAI
        product: AssistantDomain
      - package: PhonePersonalAI
        product: AssistantPlatform
      - package: PhonePersonalAI
        product: AssistantPersistence
      - package: PhonePersonalAI
        product: AssistantPersistenceSwiftData
      - package: PhonePersonalAI
        product: ExecutiveSupport
      # For `SystemSurfaceCommandService` and `SystemSurfaceService`. Brings
      # `AssistantAI` with it, which is protocols — no provider implementation
      # is in this graph.
      - package: PhonePersonalAI
        product: AssistantCore
      # So a reminder cancelled from a widget is cancelled with the same
      # notification centre the app scheduled it with. See `SystemSurfaceBridge`.
      - package: PhonePersonalAI
        product: AssistantPlatformApple
    settings:
      base:
        INFOPLIST_FILE: iOS/SystemSurfaces/Widgets/Info.plist
        PRODUCT_BUNDLE_IDENTIFIER: com.example.personalassistant.widgets
        CODE_SIGN_ENTITLEMENTS: iOS/SystemSurfaces/Widgets/PersonalAssistantWidgets.entitlements
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_VERSION: "5.0"
        GENERATE_INFOPLIST_FILE: NO
        SKIP_INSTALL: YES
        ENABLE_USER_SCRIPT_SANDBOXING: YES
        MARKETING_VERSION: "0.1"
        CURRENT_PROJECT_VERSION: "1"
        CODE_SIGNING_ALLOWED: NO
        CODE_SIGNING_REQUIRED: NO
        CODE_SIGN_IDENTITY: ""

  # MARK: The custom keyboard
  #
  # The shortest dependency list in the project, and that is the point.
  # `SystemSurfaces` is Foundation-only, so this target cannot reach a
  # repository, the engine, a provider or llama.cpp — sections 15, 16, 120 and
  # 121 enforced by the graph rather than by a promise. A keyboard extension
  # gets a fraction of an app's memory; there is nothing here that could
  # exhaust it.
  PersonalAssistantKeyboard:
    type: app-extension
    platform: iOS
    sources:
      - path: iOS/SystemSurfaces/Keyboard
    dependencies:
      - package: PhonePersonalAI
        product: SystemSurfaces
    settings:
      base:
        INFOPLIST_FILE: iOS/SystemSurfaces/Keyboard/Info.plist
        PRODUCT_BUNDLE_IDENTIFIER: com.example.personalassistant.keyboard
        CODE_SIGN_ENTITLEMENTS: iOS/SystemSurfaces/Keyboard/PersonalAssistantKeyboard.entitlements
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_VERSION: "5.0"
        GENERATE_INFOPLIST_FILE: NO
        SKIP_INSTALL: YES
        ENABLE_USER_SCRIPT_SANDBOXING: YES
        MARKETING_VERSION: "0.1"
        CURRENT_PROJECT_VERSION: "1"
        CODE_SIGNING_ALLOWED: NO
        CODE_SIGNING_REQUIRED: NO
        CODE_SIGN_IDENTITY: ""
