# XcodeGen spec for the iOS app target.
#
# The repository has no `.xcodeproj`, because a hand-written `project.pbxproj`
# is unreviewable and goes stale the moment anyone touches it in Xcode. This
# spec generates one instead:
#
#     brew install xcodegen
#     xcodegen generate
#     open PersonalAssistant.xcodeproj
#
# Creating the target by hand in Xcode works equally well — this file then
# doubles as the checklist of what that target needs. See iOS/README.md.
#
# TODO-XCODE: unverified. This has never been run through XcodeGen or Xcode.

name: PersonalAssistant

options:
  bundleIdPrefix: com.example.personalassistant
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

packages:
  PhonePersonalAI:
    # The core lives in the Swift package at the repository root.
    path: .

targets:
  PersonalAssistant:
    type: application
    platform: iOS
    # Development configuration. Config/App.xcconfig optionally includes the
    # gitignored Config/LocalSecrets.xcconfig; absent, everything stays blank.
    configFiles:
      Debug: Config/App.xcconfig
      Release: Config/App.xcconfig
    sources:
      - path: iOS/App
      - path: iOS/Data
      - path: iOS/Presentation
      - path: iOS/RemoteAI
      - path: iOS/ViewModels
      - path: iOS/UI
      - path: iOS/Resources
      # Apple platform adapters. Every file here is a TODO-XCODE skeleton that
      # throws rather than pretending to work, so the target still builds.
      - path: iOS/Platform
    dependencies:
      - package: PhonePersonalAI
        product: AssistantCore
      - package: PhonePersonalAI
        product: AssistantDomain
      - package: PhonePersonalAI
        product: AssistantAI
      - package: PhonePersonalAI
        product: AssistantTools
      - package: PhonePersonalAI
        product: AssistantPlatform
      - package: PhonePersonalAI
        product: AssistantPersistence
      # The production store. SwiftData lives in this target and nowhere else.
      - package: PhonePersonalAI
        product: AssistantPersistenceSwiftData
      - package: PhonePersonalAI
        product: ExecutiveSupport
      - package: PhonePersonalAI
        product: MockPlatform
      - package: PhonePersonalAI
        product: AIProviderApple
      - package: PhonePersonalAI
        product: AIProviderLocal
      - package: PhonePersonalAI
        product: AIProviderRemote
      # Development-only: the scripted stand-in that drives the assistant while
      # no model is connected. Remove this dependency when one is.
      - package: PhonePersonalAI
        product: DevSupport
    settings:
      base:
        INFOPLIST_FILE: iOS/Resources/Info.plist
        PRODUCT_BUNDLE_IDENTIFIER: com.example.personalassistant
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: "1" # iPhone
        SWIFT_VERSION: "5.0"
        ENABLE_USER_SCRIPT_SANDBOXING: YES
        # The Info.plist is written by hand, so nothing is generated into it.
        # Every key the system needs is in iOS/Resources/Info.plist.
        GENERATE_INFOPLIST_FILE: NO
        DEVELOPMENT_LANGUAGE: en
        MARKETING_VERSION: "0.1"
        CURRENT_PROJECT_VERSION: "1"
        # Simulator builds in CI must not need a signing identity.
        CODE_SIGNING_ALLOWED: NO
        CODE_SIGNING_REQUIRED: NO
        CODE_SIGN_IDENTITY: ""
