name: Apple SDK Check

# Compiles the app against an Xcode/iOS SDK that actually contains
# FoundationModels.
#
# Why this exists as a second workflow rather than a change to the preview
# build: the preview runs on macos-15 / Xcode 16.4, whose iOS SDK has no
# FoundationModels at all. `#if canImport(FoundationModels)` is therefore false
# there, and every line of the Apple provider compiles out. That build stays
# green whatever is written inside the guard — which makes it worthless as a
# check on this milestone's actual code.
#
# This job is build-only. It never runs a simulator, never launches the app and
# never asks the model for anything: Apple Intelligence inference needs eligible
# hardware with the model downloaded, which no CI runner has. What it proves is
# narrower and worth exactly what it says — that the Foundation Models
# integration compiles against a real Apple SDK.

on:
  push:
    paths:
      - "iOS/**"
      - "Sources/**"
      - "Package.swift"
      - "project.yml"
      - ".github/workflows/apple-sdk-check.yml"
  pull_request:
    paths:
      - "iOS/**"
      - "Sources/**"
      - "Package.swift"
      - "project.yml"
      - ".github/workflows/apple-sdk-check.yml"
  workflow_dispatch:

concurrency:
  group: apple-sdk-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  compile:
    name: Compile against the Apple Intelligence SDK
    runs-on: macos-26
    timeout-minutes: 30

    env:
      SCHEME: PersonalAssistant
      PROJECT: PersonalAssistant.xcodeproj
      DERIVED_DATA: ${{ github.workspace }}/.ci-deriveddata
      BUILD_LOG: ${{ github.workspace }}/artifacts/apple-sdk-build.log

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Show Xcode environment
        run: |
          set -euo pipefail
          mkdir -p "$(dirname "$BUILD_LOG")"
          sw_vers
          echo "--- available Xcode versions ---"
          ls /Applications | grep -i '^Xcode' || true
          echo "--- selected ---"
          xcodebuild -version
          swift --version
          echo "--- iOS SDKs ---"
          xcodebuild -showsdks | grep -i ios || true

      - name: Confirm the SDK actually has the frameworks under test
        # Fails loudly and early if the runner image does not carry them.
        # Without this the build below would simply compile the
        # `#if canImport` branches out and go green, which is the exact false
        # negative this workflow exists to prevent.
        run: |
          set -euo pipefail
          SDK_PATH="$(xcrun --sdk iphonesimulator --show-sdk-path)"
          echo "Simulator SDK: $SDK_PATH"

          MISSING=0
          for FRAMEWORK in FoundationModels AlarmKit EventKit UserNotifications; do
            if [ -d "$SDK_PATH/System/Library/Frameworks/$FRAMEWORK.framework" ]; then
              echo "$FRAMEWORK.framework is present."
            else
              echo "::error::$FRAMEWORK.framework is missing from $SDK_PATH."
              MISSING=1
            fi
          done

          if [ "$MISSING" -ne 0 ]; then
            echo "This runner image cannot verify the guarded code. Check the Xcode version above."
            exit 1
          fi

      - name: Install XcodeGen
        run: |
          set -euo pipefail
          brew install xcodegen
          xcodegen --version

      - name: Generate Xcode project
        run: |
          set -euo pipefail
          xcodegen generate --spec project.yml
          test -d "$PROJECT" || { echo "::error::$PROJECT was not generated"; exit 1; }

      - name: Build for the simulator
        run: |
          set -euo pipefail
          # Build only — no boot, no install, no launch. `generic/platform`
          # avoids pinning to a device that may not exist on a new image.
          xcodebuild build \
            -project "$PROJECT" \
            -scheme "$SCHEME" \
            -configuration Debug \
            -destination "generic/platform=iOS Simulator" \
            -derivedDataPath "$DERIVED_DATA" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            2>&1 | tee "$BUILD_LOG"

      - name: Prove the guarded Apple code was really compiled
        # The whole point. If the guarded code had been skipped, nothing in the
        # bundle would reference the framework and the job would be reporting
        # success on having compiled nothing.
        #
        # Every Mach-O in the bundle is searched, not just the executable: a
        # Debug build puts the app's own code in PersonalAssistant.debug.dylib
        # and leaves a thin stub behind, so checking only the stub finds
        # nothing however much guarded code was compiled.
        #
        # Two kinds of framework, checked differently:
        #
        #   REQUIRED_WEAK  — newer than the iOS 17 deployment target, so they
        #                    must be *weakly* linked. dyld refuses to start an
        #                    app that strongly links a framework the OS does
        #                    not have, which is a launch crash on most of the
        #                    devices this app supports and something no amount
        #                    of `if #available` in Swift prevents.
        #   REQUIRED       — available on iOS 17, so ordinary linking is right.
        #                    Checked only for presence, which proves the
        #                    platform layer is in the binary rather than
        #                    compiled out.
        run: |
          set -euo pipefail
          APP="$(find "$DERIVED_DATA/Build/Products" -name "$SCHEME.app" -type d | head -n 1)"
          if [ -z "$APP" ]; then
            echo "::error::No app bundle produced."
            exit 1
          fi

          REQUIRED_WEAK="FoundationModels AlarmKit"
          REQUIRED="EventKit UserNotifications"
          FAILED=0

          BINARIES="$(find "$APP" -type f \( -name "*.dylib" -o -name "$SCHEME" -o -perm -u+x \) 2>/dev/null)"

          linked_by() {
            local framework="$1"
            while IFS= read -r f; do
              [ -n "$f" ] || continue
              if otool -L "$f" 2>/dev/null | grep -q "/$framework.framework/"; then echo "$f"; fi
            done <<< "$BINARIES"
          }

          for FRAMEWORK in $REQUIRED_WEAK $REQUIRED; do
            MATCHES="$(linked_by "$FRAMEWORK")"

            if [ -z "$MATCHES" ]; then
              echo "::error::Nothing in the app bundle references $FRAMEWORK."
              echo "Its #if canImport branch was compiled out; this job verified nothing about it."
              FAILED=1
              continue
            fi

            echo "$FRAMEWORK is linked by:"
            echo "$MATCHES"

            case " $REQUIRED_WEAK " in
              *" $FRAMEWORK "*) ;;
              *) continue ;;
            esac

            # A here-string, not a pipe: a `while` on the right of a pipe runs
            # in a subshell, where setting FAILED would be lost.
            while IFS= read -r f; do
              [ -n "$f" ] || continue
              if otool -l "$f" | grep -A4 'LC_LOAD_WEAK_DYLIB' | grep -q "/$FRAMEWORK.framework/"; then
                echo "  weakly linked in $f — safe to run on iOS 17."
              else
                echo "::error::$FRAMEWORK is strongly linked in $f."
                echo "The app would fail to launch on every iOS older than the one that introduced it."
                FAILED=1
              fi
            done <<< "$MATCHES"
          done

          if [ "$FAILED" -ne 0 ]; then
            echo "--- what the bundle actually links ---"
            while IFS= read -r f; do
              [ -n "$f" ] || continue
              echo "--- $f"; otool -L "$f" 2>/dev/null | head -n 30
            done <<< "$BINARIES"
            exit 1
          fi

      - name: Report compiler errors
        if: failure()
        run: |
          set -uo pipefail
          if [ ! -f "$BUILD_LOG" ]; then
            echo "No build log — the failure was before xcodebuild ran."
            exit 0
          fi
          echo "===== compiler errors ====="
          grep -E "error:|\*\* BUILD FAILED|The following build commands failed" \
            "$BUILD_LOG" \
            | sort -u \
            | head -n 60 \
            || echo "(nothing matched)"
          echo "===== end ====="

      - name: Upload build log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: apple-sdk-build-log
          path: artifacts/apple-sdk-build.log
          retention-days: 7
          if-no-files-found: ignore
