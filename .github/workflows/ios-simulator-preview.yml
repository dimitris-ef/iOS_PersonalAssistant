name: iOS Simulator Preview

# Builds the real PersonalAssistant app on a GitHub-hosted macOS runner, runs it
# in an iPhone Simulator, and uploads a screenshot plus the Simulator .app.
#
# The point is to give a Windows developer a build-and-look loop without owning
# a Mac. It is not a substitute for interactive development in Xcode.

on:
  push:
    paths:
      - "iOS/**"
      - "Sources/**"
      - "Package.swift"
      - "project.yml"
      - ".github/workflows/ios-simulator-preview.yml"
  pull_request:
    paths:
      - "iOS/**"
      - "Sources/**"
      - "Package.swift"
      - "project.yml"
      - ".github/workflows/ios-simulator-preview.yml"
  # Lets you ask for a fresh preview from the Actions tab without pushing.
  workflow_dispatch:

# A newer push to the same branch makes the in-flight preview stale, and macOS
# runner minutes are expensive.
concurrency:
  group: ios-preview-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  simulator-preview:
    name: Build, run and screenshot
    # Pinned rather than macos-latest so a new image rolling out cannot change
    # the Xcode version underneath a green build without a visible commit.
    runs-on: macos-15
    timeout-minutes: 45

    env:
      SCHEME: PersonalAssistant
      PROJECT: PersonalAssistant.xcodeproj
      DERIVED_DATA: ${{ github.workspace }}/.ci-deriveddata
      ARTIFACTS: ${{ github.workspace }}/artifacts
      BUILD_LOG: ${{ github.workspace }}/artifacts/xcodebuild.log

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Show Xcode environment
        run: |
          set -euo pipefail
          mkdir -p "$ARTIFACTS"
          echo "::group::Versions"
          sw_vers
          xcodebuild -version
          swift --version
          echo "::endgroup::"
          echo "::group::Installed simulator runtimes"
          xcrun simctl list runtimes
          echo "::endgroup::"

      - name: Install XcodeGen
        run: |
          set -euo pipefail
          # Homebrew is preinstalled on GitHub macOS images.
          brew install xcodegen
          xcodegen --version

      - name: Generate Xcode project
        run: |
          set -euo pipefail
          # project.yml is the source of truth; no .xcodeproj is committed.
          xcodegen generate --spec project.yml
          test -d "$PROJECT" || { echo "::error::$PROJECT was not generated"; exit 1; }

      - name: Inspect generated project
        run: |
          set -euo pipefail
          xcodebuild -list -project "$PROJECT"
          # Fail early and clearly rather than deep inside a build.
          if ! xcodebuild -list -project "$PROJECT" | grep -qE "^[[:space:]]+${SCHEME}$"; then
            echo "::error::Scheme '$SCHEME' not found in $PROJECT. See the scheme list above."
            exit 1
          fi

      - name: Select simulator
        id: simulator
        run: |
          set -euo pipefail
          # Picks the newest iOS runtime, then the highest-numbered plain iPhone
          # available on it. Deliberately not a hardcoded device name: GitHub
          # changes which devices ship with each image.
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json, os, re, subprocess, sys

          raw = subprocess.check_output(
              ["xcrun", "simctl", "list", "devices", "available", "--json"]
          )
          data = json.loads(raw)

          def variant_rank(name: str) -> int:
              # Prefer the plain model, then Pro, then the larger/odd ones.
              if re.search(r"\bSE\b", name):
                  return 0
              if "mini" in name:
                  return 1
              if "Pro Max" in name:
                  return 2
              if "Plus" in name:
                  return 3
              if "Pro" in name:
                  return 4
              return 5

          candidates = []
          for runtime, devices in data.get("devices", {}).items():
              match = re.search(r"SimRuntime\.iOS-(\d+)-(\d+)", runtime)
              if not match:
                  continue
              version = (int(match.group(1)), int(match.group(2)))
              for device in devices:
                  if not device.get("isAvailable"):
                      continue
                  name = device.get("name", "")
                  if not name.startswith("iPhone"):
                      continue
                  number = re.search(r"iPhone\s+(\d+)", name)
                  candidates.append((
                      version,
                      int(number.group(1)) if number else 0,
                      variant_rank(name),
                      name,
                      device["udid"],
                      f"iOS {version[0]}.{version[1]}",
                  ))

          if not candidates:
              print("::error::No available iPhone simulator found", file=sys.stderr)
              sys.exit(1)

          candidates.sort(reverse=True)
          _, _, _, name, udid, runtime_label = candidates[0]

          print(f"Selected {name} ({runtime_label}) — {udid}", file=sys.stderr)
          print(f"udid={udid}")
          print(f"name={name}")
          print(f"runtime={runtime_label}")
          PY

      - name: Boot simulator
        run: |
          set -euo pipefail
          UDID="${{ steps.simulator.outputs.udid }}"
          echo "Booting ${{ steps.simulator.outputs.name }} (${{ steps.simulator.outputs.runtime }})"
          # Already-booted is not an error worth failing on.
          xcrun simctl boot "$UDID" || true
          # Blocks until the device reports it has finished booting.
          xcrun simctl bootstatus "$UDID" -b
          # simctl can screenshot a headless device, but attaching the Simulator
          # app makes the render reliably non-blank.
          open -a Simulator --args -CurrentDeviceUDID "$UDID"
          sleep 5
          xcrun simctl list devices booted

      - name: Build PersonalAssistant
        run: |
          set -euo pipefail
          # pipefail is load-bearing: without it, tee's exit code would mask a
          # failed xcodebuild and the job would go green on a broken build.
          #
          # Output is NOT passed through xcpretty or similar — a Windows
          # developer reading this log needs the raw file, line and compiler
          # message, and pretty-printers routinely swallow them.
          xcodebuild build \
            -project "$PROJECT" \
            -scheme "$SCHEME" \
            -configuration Debug \
            -destination "id=${{ steps.simulator.outputs.udid }}" \
            -derivedDataPath "$DERIVED_DATA" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            2>&1 | tee "$BUILD_LOG"

      - name: Locate app bundle
        id: app
        run: |
          set -euo pipefail
          PRODUCTS="$DERIVED_DATA/Build/Products/Debug-iphonesimulator"
          APP="$PRODUCTS/$SCHEME.app"

          if [ ! -d "$APP" ]; then
            # The configuration can put it elsewhere; look before giving up.
            echo "Not at the expected path, searching DerivedData…"
            APP="$(find "$DERIVED_DATA" -name "$SCHEME.app" -type d -path "*iphonesimulator*" | head -n 1 || true)"
          fi

          if [ -z "${APP:-}" ] || [ ! -d "$APP" ]; then
            echo "::error::Could not find $SCHEME.app for the simulator. The build reported success but produced no bundle."
            find "$DERIVED_DATA/Build/Products" -maxdepth 2 -print || true
            exit 1
          fi

          # Read the identifier out of the built bundle rather than repeating it
          # in the workflow, so it can never drift from project.yml.
          BUNDLE_ID="$(/usr/libexec/PlistBuddy -c "Print :CFBundleIdentifier" "$APP/Info.plist")"
          if [ -z "$BUNDLE_ID" ] || [[ "$BUNDLE_ID" == *"\$("* ]]; then
            echo "::error::The built app has no usable CFBundleIdentifier ('$BUNDLE_ID'). Check iOS/Resources/Info.plist."
            exit 1
          fi

          echo "App bundle: $APP"
          echo "Bundle id:  $BUNDLE_ID"
          echo "path=$APP" >> "$GITHUB_OUTPUT"
          echo "bundle_id=$BUNDLE_ID" >> "$GITHUB_OUTPUT"

      - name: Install app
        run: |
          set -euo pipefail
          xcrun simctl install "${{ steps.simulator.outputs.udid }}" "${{ steps.app.outputs.path }}"

      - name: Launch app
        run: |
          set -euo pipefail
          UDID="${{ steps.simulator.outputs.udid }}"
          BUNDLE_ID="${{ steps.app.outputs.bundle_id }}"

          if ! xcrun simctl launch "$UDID" "$BUNDLE_ID"; then
            echo "::error::Launch failed for $BUNDLE_ID."
            echo "Recent device log:"
            xcrun simctl spawn "$UDID" log show --last 2m --predicate "processImagePath CONTAINS[c] '$SCHEME'" --style compact || true
            exit 1
          fi

          # Long enough for the SwiftUI hierarchy plus the async demo-data
          # bootstrap in AppModel.bootstrap(), short enough not to waste runner
          # minutes. Not a guess at "eventually it'll be ready".
          sleep 8

      - name: Capture screenshots
        run: |
          set -euo pipefail
          UDID="${{ steps.simulator.outputs.udid }}"
          mkdir -p "$ARTIFACTS"

          # A fixed status bar keeps screenshots comparable between runs.
          xcrun simctl status_bar "$UDID" override \
            --time "9:41" \
            --batteryState charged \
            --batteryLevel 100 \
            --cellularBars 4 \
            --wifiBars 3 || true

          xcrun simctl io "$UDID" screenshot "$ARTIFACTS/personal-assistant-main.png"

          # The app supports both appearances, so both are worth seeing.
          xcrun simctl ui "$UDID" appearance dark || true
          sleep 3
          xcrun simctl io "$UDID" screenshot "$ARTIFACTS/personal-assistant-dark.png"
          xcrun simctl ui "$UDID" appearance light || true

          ls -lh "$ARTIFACTS"
          # A blank or near-blank capture usually means the app crashed on
          # launch, which is worth failing loudly for.
          MAIN_SIZE=$(stat -f%z "$ARTIFACTS/personal-assistant-main.png")
          if [ "$MAIN_SIZE" -lt 10000 ]; then
            echo "::warning::Screenshot is only ${MAIN_SIZE} bytes — the app may not have rendered."
          fi

      - name: Package simulator app
        run: |
          set -euo pipefail
          # ditto preserves the .app bundle structure and symlinks; zipping the
          # directory directly can break the bundle for Appetize and similar.
          ditto -c -k --sequesterRsrc --keepParent \
            "${{ steps.app.outputs.path }}" \
            "$ARTIFACTS/PersonalAssistant-Simulator.zip"
          ls -lh "$ARTIFACTS/PersonalAssistant-Simulator.zip"

      - name: Upload screenshot
        uses: actions/upload-artifact@v4
        with:
          name: ios-simulator-screenshot
          path: artifacts/*.png
          retention-days: 7
          if-no-files-found: error

      - name: Upload simulator build
        uses: actions/upload-artifact@v4
        with:
          name: PersonalAssistant-iOS-Simulator
          path: artifacts/PersonalAssistant-Simulator.zip
          retention-days: 7
          if-no-files-found: error

      - name: Upload build log
        # The whole point of this pipeline: the failure has to be readable from
        # Windows, without access to the runner.
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: xcodebuild-log
          path: artifacts/xcodebuild.log
          retention-days: 7
          if-no-files-found: ignore

      - name: Upload simulator diagnostics
        # Only useful once there is an app to run: a compile failure has nothing
        # to do with the device. Filtering to this app also keeps the dump from
        # burying the compiler output under three minutes of system logging.
        if: failure() && steps.app.outputs.bundle_id != ''
        run: |
          set -euo pipefail
          UDID="${{ steps.simulator.outputs.udid }}"
          echo "::group::Recent simulator log"
          xcrun simctl spawn "$UDID" log show --last 3m --style compact \
            --predicate "processImagePath CONTAINS[c] '$SCHEME'" 2>/dev/null \
            | tail -n 200 || true
          echo "::endgroup::"

      - name: Report compiler errors
        # Last on purpose. The build log is uploaded as an artifact above, but
        # an artifact is no use to someone reading the job from a phone or an
        # API — so the errors themselves go in the log, at the end, where they
        # can be found without scrolling through everything else.
        if: failure()
        run: |
          set -uo pipefail
          if [ ! -f "$BUILD_LOG" ]; then
            echo "No build log — the failure was before xcodebuild ran."
            exit 0
          fi

          echo "===== compiler errors ====="
          # Swift/clang diagnostics, plus xcodebuild's own summary lines.
          grep -E "error:|\*\* BUILD FAILED|The following build commands failed" \
            "$BUILD_LOG" \
            | sort -u \
            | head -n 60 \
            || echo "(nothing matched — see the xcodebuild-log artifact)"
          echo "===== end ====="
          echo "Full log: $(wc -l < "$BUILD_LOG") lines, uploaded as the xcodebuild-log artifact."
